<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jeffrey olney</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --base:    #303446;
      --mantle:  #292c3c;
      --surface0:#414559;
      --surface1:#51576d;
      --overlay0:#737994;
      --overlay1:#838ba7;
      --text:    #c6d0f5;
      --subtext0:#a5adce;
      --subtext1:#b5bfe2;
      --blue:    #8caaee;
      --green:   #a6d189;
      --mauve:   #ca9ee6;
      --peach:   #ef9f76;
      --yellow:  #e5c890;
      --teal:    #81c8be;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--base);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.8;
      padding: 4rem 2rem;
      max-width: 680px;
      margin: 0 auto;
    }

    .prompt {
      margin-bottom: 0.1rem;
    }

    .prompt-user { color: var(--green); }
    .prompt-host { color: var(--blue); }
    .prompt-sym  { color: var(--mauve); }
    .prompt-cmd  { color: var(--text); }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: var(--mauve);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
      margin-left: 1px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .output {
      margin: 0.5rem 0 2rem 0;
      color: var(--subtext1);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .output.visible { opacity: 1; }

    .output p { margin-bottom: 0.5rem; }

    .output a {
      color: var(--blue);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }
    .output a:hover { border-bottom-color: var(--blue); }

    .output ul { list-style: none; padding: 0; }
    .output ul li { color: var(--subtext1); }
    .output ul li::before { content: '→ '; color: var(--mauve); }

    .section-label {
      color: var(--peach);
      margin-bottom: 0.25rem;
      display: block;
    }

    .exp-line {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.15rem;
    }
    .exp-left { color: var(--text); }
    .exp-role { color: var(--subtext0); font-size: 12px; }
    .exp-date { color: var(--overlay1); font-size: 12px; white-space: nowrap; }

    .exp-detail {
      color: var(--subtext0);
      font-size: 12px;
      padding-left: 1rem;
      border-left: 1px solid var(--surface1);
      margin: 0.25rem 0 0.75rem 0;
    }
    .exp-detail div { margin-bottom: 0.15rem; }
    .exp-detail div::before { content: '· '; color: var(--overlay1); }

    .proj-line {
      margin-bottom: 0.75rem;
    }
    .proj-name { color: var(--green); }
    .proj-desc { color: var(--subtext0); font-size: 12px; }
    .proj-links { font-size: 12px; }
    .proj-links a { color: var(--mauve) !important; margin-right: 1rem; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.25rem; }
    .tag {
      font-size: 11px;
      color: var(--overlay1);
      border: 1px solid var(--surface1);
      padding: 1px 6px;
      border-radius: 3px;
    }

    footer {
      margin-top: 3rem;
      color: var(--overlay0);
      font-size: 12px;
    }
    footer a { color: var(--mauve); text-decoration: none; }
  </style>
</head>
<body>

  <div id="terminal"></div>

  <footer>
    styled with <a href="https://catppuccin.com" target="_blank">catppuccin</a>
  </footer>

  <script>
    const terminal = document.getElementById('terminal');

    const sections = [
      {
        cmd: 'whoami',
        output: `
          <p>A brief history of building data pipelines, analyzing what comes out of them, and turning models into real world tools — the full stack, from raw EHR data to clinical decision support.</p>
          <p>Senior Data Scientist at <span style="color:var(--blue)">Mayo Clinic Platform</span>. Ten years in healthcare, a few before that in federal research.</p>
          <p>MBA in Technology Management · nine peer-reviewed publications · former instructor at SUNY Polytechnic. Unusual background for someone who spends a lot of time in a terminal.</p>
        `,
        delay: 500
      },
      {
        cmd: 'cat experience.md',
        output: `
          <div class="exp-line"><span class="exp-left">Mayo Clinic Platform</span><span class="exp-date">2026–present</span></div>
          <div class="exp-role" style="margin-bottom:0.25rem">Senior Data Scientist</div>
          <div class="exp-detail">
            <div>Scaling healthcare innovation by connecting advanced AI with de-identified patient data.</div>
          </div>
          <div class="exp-line"><span class="exp-left">Mayo Clinic Arizona</span><span class="exp-date">2023–2026</span></div>
          <div class="exp-role" style="margin-bottom:0.25rem">Informatics Analyst</div>
          <div class="exp-detail">
            <div>Leveraged informatics and data science to optimize information systems, analyze complex data, and solve real-world problems.</div>
          </div>
          <div class="exp-line"><span class="exp-left">OHSU Hospital</span><span class="exp-date">2017–2023</span></div>
          <div class="exp-role" style="margin-bottom:0.5rem">Business Data &amp; Financial Analyst</div>
          <div class="exp-line"><span class="exp-left">Air Force Research Laboratory</span><span class="exp-date">2014–2017</span></div>
          <div class="exp-role">Financial Systems Accountant</div>
        `,
        delay: 500
      },
      {
        cmd: 'ls projects/',
        output: `
          <div class="proj-line">
            <div class="proj-name">Symptom Tracker</div>
            <div class="proj-desc">Privacy-first AI symptom analysis with Groq/Llama3-70B. TypeScript + React.</div>
            <div class="proj-links"><a href="https://symptom-tracker-three.vercel.app/" target="_blank">demo</a><a href="https://github.com/olneyjR/symptom-tracker" target="_blank">code</a></div>
          </div>
          <div class="proj-line">
            <div class="proj-name">Health Rankings ML</div>
            <div class="proj-desc">ML analysis of U.S. state health outcomes — Random Forest, PCA, K-means.</div>
            <div class="proj-links"><a href="https://health-rankings-analysis-2025.streamlit.app/" target="_blank">demo</a><a href="https://github.com/olneyjR/health-rankings-ml" target="_blank">code</a></div>
          </div>
          <div class="proj-line">
            <div class="proj-name">PaceWise RAG</div>
            <div class="proj-desc">Marathon training assistant using RAG, LangChain, and ChromaDB.</div>
            <div class="proj-links"><a href="https://pace-wise-rag.streamlit.app/" target="_blank">demo</a><a href="https://github.com/olneyjR/pace-wise-RAG" target="_blank">code</a></div>
          </div>
          <div class="proj-line">
            <div class="proj-name">FDA Drug Safety Pipeline</div>
            <div class="proj-desc">Production pipeline with Airflow, Docker, and Parquet optimization.</div>
            <div class="proj-links"><a href="https://fda-drug-safety-dashboard-api-supplamental.streamlit.app/" target="_blank">demo</a><a href="https://github.com/olneyjR/mediquality-analytics" target="_blank">code</a></div>
          </div>
        `,
        delay: 400
      },
      {
        cmd: 'cat skills.txt',
        output: `
          <p><span style="color:var(--peach)">languages &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> R · Python · SQL · TypeScript</p>
          <p><span style="color:var(--peach)">engineering &nbsp;&nbsp;&nbsp;</span> Fabric · Airflow · dbt · Docker · BigQuery · Parquet</p>
          <p><span style="color:var(--peach)">analytics &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> R Shiny · ggplot2 · Streamlit · Plotly · Power BI</p>
          <p><span style="color:var(--peach)">ml / ai &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span> scikit-learn · XGBoost · BioBERT · LangChain · RAG</p>
          <p><span style="color:var(--peach)">infrastructure &nbsp;</span> GCP · Azure · Posit Connect · Epic Clarity</p>
        `,
        delay: 400
      },
      {
        cmd: 'cat interests.md',
        output: `
          <ul>
            <li>marathon running — 2:42 PR</li>
            <li>alpine touring skiing</li>
            <li>drumming</li>
            <li>reading</li>
            <li>open source</li>
            <li>AI governance</li>
            <li>dogs</li>
          </ul>
        `,
        delay: 400
      },
      {
        cmd: 'contact',
        output: `
          <ul>
            <li><a href="https://github.com/olneyjR" target="_blank">github.com/olneyjR</a></li>
            <li><a href="https://linkedin.com/in/jeffrey-olney" target="_blank">linkedin.com/in/jeffrey-olney</a></li>
            <li><a href="mailto:olneyjr2@gmail.com">olneyjr2@gmail.com</a></li>
          </ul>
          <p style="margin-top:0.75rem; color:var(--overlay1); font-size:12px">Open to: data engineering · analytics engineering · data science · ML engineering · healthcare analytics · remote</p>
        `,
        delay: 300
      }
    ];

    function typeText(el, text, callback) {
      let i = 0;
      const cursor = el.nextElementSibling;
      function tick() {
        if (i < text.length) {
          el.textContent += text[i++];
          setTimeout(tick, 55 + Math.random() * 25);
        } else {
          if (cursor) cursor.style.display = 'none';
          if (callback) callback();
        }
      }
      tick();
    }

    function renderSection(index) {
      if (index >= sections.length) return;
      const s = sections[index];

      const id = Math.random().toString(36).slice(2);
      const promptEl = document.createElement('div');
      promptEl.className = 'prompt';
      promptEl.innerHTML = `<span class="prompt-user">jeffrey</span><span style="color:var(--overlay1)">@</span><span class="prompt-host">olney</span> <span class="prompt-sym">❯</span> <span id="t-${id}"></span><span class="cursor"></span>`;
      terminal.appendChild(promptEl);

      const typedEl = document.getElementById(`t-${id}`);

      setTimeout(() => {
        typeText(typedEl, s.cmd, () => {
          setTimeout(() => {
            const out = document.createElement('div');
            out.className = 'output';
            out.innerHTML = s.output;
            terminal.appendChild(out);
            requestAnimationFrame(() => requestAnimationFrame(() => out.classList.add('visible')));
            setTimeout(() => renderSection(index + 1), s.delay);
          }, 150);
        });
      }, index === 0 ? 600 : 200);
    }

    renderSection(0);
  </script>
</body>
</html>
